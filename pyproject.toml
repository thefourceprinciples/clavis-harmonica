[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clavis-harmonica"
version = "0.1.0"
description = "CLV-HTE-001: The Harmonic Key of Human and Material Coherence"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26.0",
]

[project.optional-dependencies]
app = [
    "streamlit>=1.35.0",
    "matplotlib>=3.8.0",
]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
